
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi mẹ yêu - 20/10 ❤️</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(-45deg, #ffd6e7, #fff0f5, #ffc4dc, #fff7fa);
    background-size: 400% 400%;
    animation: backgroundMove 10s ease infinite;
}

/* Khung lời chúc */
.card {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 720px;
    padding: 40px 25px;
    text-align: center;
    background: rgba(255,255,255,0.76);
    border: 2px solid white;
    border-radius: 30px;
    box-shadow: 0 0 25px #ff70a6, 0 0 65px #ffa6ca88;
    animation: cardAppear 1.5s ease, cardFloat 4s ease-in-out 1.5s infinite;
}

h1 {
    color: #ff4081;
    font-size: clamp(27px, 5vw, 42px);
    animation: titleGlow 2s infinite alternate;
}

.message {
    color: #923d60;
    font-size: clamp(17px, 3vw, 23px);
    line-height: 1.9;
}

.message p {
    opacity: 0;
    animation: textAppear 1.2s ease forwards;
}

.message p:nth-child(1) { animation-delay: 1s; }
.message p:nth-child(2) { animation-delay: 2.3s; }
.message p:nth-child(3) { animation-delay: 3.6s; }

.signature {
    color: #ff4081;
    font-size: 23px;
    font-weight: bold;
    opacity: 0;
    animation: textAppear 1.5s 4.8s forwards;
}

/* Hoa xoay và nhún */
.flower {
    position: fixed;
    z-index: 1;
    font-size: 42px;
    animation: flowerDance 3s ease-in-out infinite;
}

.f1 { top: 8%; left: 8%; }
.f2 { top: 12%; right: 9%; animation-delay: .5s; }
.f3 { bottom: 10%; left: 9%; animation-delay: 1s; }
.f4 { bottom: 8%; right: 8%; animation-delay: 1.5s; }

/* Cánh hoa và trái tim */
.particle {
    position: fixed;
    top: -50px;
    z-index: 4;
    pointer-events: none;
    animation: petalFall linear forwards;
}

.heart {
    position: fixed;
    bottom: -50px;
    z-index: 3;
    pointer-events: none;
    animation: heartFly linear forwards;
}

@keyframes backgroundMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes cardAppear {
    from { opacity: 0; transform: scale(.65) rotate(-5deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes cardFloat {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -8px; }
}

@keyframes titleGlow {
    from { text-shadow: 0 0 5px #ffb6cf; }
    to { text-shadow: 0 0 22px #ff4081, 0 0 35px #ff9abd; }
}

@keyframes textAppear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes flowerDance {
    0%, 100% { transform: rotate(-15deg) translateY(0) scale(1); }
    50% { transform: rotate(15deg) translateY(-18px) scale(1.12); }
}

@keyframes petalFall {
    0% { transform: translate(0, -5vh) rotate(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(100px, 110vh) rotate(720deg); opacity: 0; }
}

@keyframes heartFly {
    0% { transform: translateY(0) scale(.7) rotate(-10deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-115vh) scale(1.3) rotate(25deg); opacity: 0; }
}

/* Trái tim khi nhấn màn hình */
.click-heart {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    animation: popHeart 1s ease-out forwards;
}

@keyframes popHeart {
    0% { transform: scale(.3); opacity: 0; }
    30% { transform: scale(1.5); opacity: 1; }
    100% { transform: translateY(-100px) scale(.7); opacity: 0; }
}

@media (max-width: 480px) {
    .card { padding: 30px 16px; }
    .flower { font-size: 28px; }
}
</style>
</head>

<body>

<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>
<div class="flower f3">🌹</div>
<div class="flower f4">🌺</div>

<div class="card">
    <h1>💖 Chúc Mừng 20/10 💖</h1>

    <div class="message">
        <p>Nhân ngày 20/10,</p>
        <p>con chúc mẹ luôn mạnh khỏe, vui vẻ, hạnh phúc.</p>
        <p>Cảm ơn mẹ vì đã luôn yêu thương con. ❤️</p>
    </div>

    <div class="signature">🌷 Con yêu mẹ nhiều lắm! 🌷</div>
</div>

<script>
// Cánh hoa rơi
function createPetal() {
    const el = document.createElement("div");
    el.className = "particle";
    el.textContent = ["🌸", "🌷", "🌺", "🌼"][Math.floor(Math.random() * 4)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (14 + Math.random() * 20) + "px";
    el.style.animationDuration = (5 + Math.random() * 6) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 11000);
}

// Trái tim bay lên
function createHeart() {
    const el = document.createElement("div");
    el.className = "heart";
    el.textContent = ["❤️", "💗", "💕", "💖"][Math.floor(Math.random() * 4)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (18 + Math.random() * 25) + "px";
    el.style.animationDuration = (5 + Math.random() * 4) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 10000);
}

setInterval(createPetal, 400);
setInterval(createHeart, 650);

// Nhấn hoặc chạm màn hình để tạo trái tim nở ra
document.addEventListener("pointerdown", function(e) {
    for (let i = 0; i < 6; i++) {
        const el = document.createElement("div");
        el.className = "click-heart";
        el.textContent = ["💖", "💕", "❤️"][i % 3];
        el.style.left = (e.clientX + Math.random() * 70 - 35) + "px";
        el.style.top = (e.clientY + Math.random() * 40 - 20) + "px";
        el.style.fontSize = (20 + Math.random() * 15) + "px";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1100);
    }
});
</script>

</body>
</html>
